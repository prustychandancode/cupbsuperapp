          <label for="roll-no" class="font-label text-label-md text-secondary" data-design-text-token="label-md">Roll Number</label>
          <input id="roll-no" type="text" value="24CUPB1042" placeholder="e.g. 24CUPB1042" class="w-full bg-background border border-outline-subtle rounded-md px-md py-sm font-mono text-mono-sm text-on-surface focus:border-primary focus:ring-0">
