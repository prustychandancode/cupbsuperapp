<body class="bg-background text-on-background font-body antialiased">
  <div class="w-full max-w-[390px] mx-auto min-h-screen flex flex-col bg-background">

    <!-- Contextual Header -->
    <header class="sticky top-0 z-30 bg-background px-lg pt-lg pb-md flex items-center justify-between gap-md">
      <div class="flex items-center gap-md">
        <a href="../restaurant-details/RestaurantDetails.html" aria-label="Back to Restaurant" class="inline-flex items-center justify-center w-10 h-10 bg-surface border border-outline-subtle text-secondary rounded-full">
          <span class="material-symbols-outlined text-[20px]" aria-hidden="true">arrow_back</span>
        </a>
        <div>
          <h1 class="font-headline text-headline-md text-secondary" data-design-text-token="headline-md">Food Cart</h1>
          <p class="font-body text-body-sm text-text-secondary" data-design-text-token="body-sm">Punjabi Zaika</p>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 px-lg pb-24 flex flex-col gap-lg">

      <!-- Promotional Banner Card -->
      <section class="bg-gradient-to-r from-primary-tint via-surface to-surface border border-primary/20 rounded-xl p-lg flex items-center justify-between gap-md shadow-sm">
        <div class="flex flex-col gap-xs">
          <span class="font-label text-label-md text-primary-deep" data-design-text-token="label-md">APPLIED: CUPB20</span>
          <p class="font-title text-title-md text-secondary" data-design-text-token="title-md">You saved ₹50 on this order!</p>
        </div>
        <span class="material-symbols-outlined text-[24px] text-primary-deep" aria-hidden="true">verified</span>
      </section>

      <!-- Delivery Address -->
      <section class="bg-surface rounded-xl border border-outline-subtle shadow-sm p-lg flex items-center justify-between gap-md">
        <div class="flex items-center gap-md">
          <div class="w-10 h-10 rounded-lg bg-primary-tint flex items-center justify-center text-primary-deep shrink-0">
            <span class="material-symbols-outlined text-[20px]" aria-hidden="true">location_on</span>
          </div>
          <div>
            <h2 class="font-title text-title-md text-on-surface" data-design-text-token="title-md">Hostel 4, Room 212</h2>
            <p class="font-body text-body-sm text-text-secondary" data-design-text-token="body-sm">Delivery in 20 mins</p>
          </div>
        </div>
        <button type="button" class="font-label text-label-md text-primary-deep" data-design-text-token="label-md">Change</button>
      </section>

      <!-- Cart Items -->
      <section class="bg-surface rounded-xl border border-outline-subtle shadow-sm p-lg flex flex-col gap-md">
        <h2 class="font-headline text-title-lg text-secondary" data-design-text-token="title-lg">Your Items</h2>

        <div class="flex items-center justify-between gap-md">
          <div>
            <h3 class="font-title text-title-md text-on-surface" data-design-text-token="title-md">Chicken Biryani</h3>
            <span class="font-body text-body-sm text-text-secondary tabular-nums" data-design-text-token="body-sm">₹149</span>
          </div>
          <div class="inline-flex items-center gap-sm bg-background border border-outline-subtle rounded-md px-sm py-xs">
            <button type="button" aria-label="Decrease quantity" class="w-6 h-6 flex items-center justify-center text-secondary font-label text-label-lg">−</button>
            <span class="font-label text-label-md text-on-surface tabular-nums" data-design-text-token="label-md">1</span>
            <button type="button" aria-label="Increase quantity" class="w-6 h-6 flex items-center justify-center text-primary-deep font-label text-label-lg">+</button>
          </div>
        </div>

        <div class="flex items-center justify-between gap-md pt-md border-t border-outline-subtle">
          <div>
            <h3 class="font-title text-title-md text-on-surface" data-design-text-token="title-md">Hostel Thali</h3>
            <span class="font-body text-body-sm text-text-secondary tabular-nums" data-design-text-token="body-sm">₹99</span>
          </div>
          <div class="inline-flex items-center gap-sm bg-background border border-outline-subtle rounded-md px-sm py-xs">
            <button type="button" aria-label="Decrease quantity" class="w-6 h-6 flex items-center justify-center text-secondary font-label text-label-lg">−</button>
            <span class="font-label text-label-md text-on-surface tabular-nums" data-design-text-token="label-md">1</span>
            <button type="button" aria-label="Increase quantity" class="w-6 h-6 flex items-center justify-center text-primary-deep font-label text-label-lg">+</button>
          </div>
        </div>
      </section>

      <!-- Bill Details -->
      <section class="bg-surface rounded-xl border border-outline-subtle shadow-sm p-lg flex flex-col gap-sm">
        <h2 class="font-headline text-title-lg text-secondary pb-xs" data-design-text-token="title-lg">Bill Summary</h2>
        <div class="flex items-center justify-between">
          <span class="font-body text-body-md text-text-secondary" data-design-text-token="body-md">Item Total</span>
          <span class="font-body text-body-md text-on-surface tabular-nums" data-design-text-token="body-md">₹248</span>
        </div>
        <div class="flex items-center justify-between">
          <span class="font-body text-body-md text-primary-deep" data-design-text-token="body-md">Student Discount</span>
          <span class="font-label text-label-lg text-primary-deep tabular-nums" data-design-text-token="label-lg">-₹50</span>
        </div>
        <div class="flex items-center justify-between">
          <span class="font-body text-body-md text-text-secondary" data-design-text-token="body-md">Delivery Fee</span>
          <span class="font-body text-body-md text-on-surface tabular-nums" data-design-text-token="body-md">₹15</span>
        </div>
        <div class="flex items-center justify-between pt-sm border-t border-outline-subtle">
          <span class="font-headline text-title-md text-secondary" data-design-text-token="title-md">To Pay</span>
          <span class="font-headline text-headline-md text-secondary tabular-nums" data-design-text-token="headline-md">₹213</span>
        </div>
      </section>

    </main>

    <!-- Sticky Place Order CTA -->
    <div class="sticky bottom-0 z-30 bg-surface border-t border-outline-subtle px-lg py-md">
      <button type="button" class="w-full inline-flex items-center justify-center gap-sm bg-primary text-on-primary px-xl py-md rounded-xl font-label text-label-lg shadow-sm tabular-nums">
        <span data-design-text-token="label-lg">Place Order • ₹213</span>
      </button>
    </div>

  </div>
